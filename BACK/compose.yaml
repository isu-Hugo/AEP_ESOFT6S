services:
  mongodb:
    image: mongo:7.0
    container_name: mongo
    #    restart: always
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_NAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - ./data:/data/db

